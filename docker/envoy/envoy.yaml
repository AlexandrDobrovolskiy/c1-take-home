admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 3000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: local
                  virtual_hosts:
                    - name: app
                      domains: ["*"]
                      routes:
                        # metrics are for the internal Prometheus scraper only
                        - match: { path: "/metrics" }
                          direct_response: { status: 404, body: { inline_string: "not found\n" } }
                        - match: { prefix: "/" }
                          route:
                            cluster: api
                            timeout: 0s
                            # Only connection-level failures that never reached a
                            # handler — safe for non-idempotent routes, and they
                            # smooth over replicas joining/leaving during scaling.
                            retry_policy:
                              retry_on: connect-failure,refused-stream
                              num_retries: 2
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: api
      connect_timeout: 2s
      type: STRICT_DNS
      # re-resolve fast so autoscaler-added replicas take traffic quickly
      dns_refresh_rate: 2s
      # route to the least-busy replica instead of blind rotation — keeps a
      # saturated or freshly-booted (cold) replica from inflating tail latency
      lb_policy: LEAST_REQUEST
      load_assignment:
        cluster_name: api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: api, port_value: 3000 }
