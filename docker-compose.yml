services:
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    ports: ["3000:3000"]
    volumes:
      - ./docker/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on: [api]

  api:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: npm start
    restart: on-failure
    env_file: .env
    expose: ["3000"]
    deploy:
      replicas: 3
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - /app/node_modules

  seed:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: npm run seed
    restart: "no"
    env_file: .env
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: relay
    ports: ["3306:3306"]
    volumes:
      - ./docker/db/mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mongo:
    image: mongo:7
    ports: ["27017:27017"]

  redis:
    image: redis:7
    expose: ["6379"]

  prometheus:
    image: prom/prometheus:v2.53.0
    # remote-write receiver lets k6 push its metrics onto the same dashboard
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    expose: ["9090"]

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3001:3000"]
    environment:
      # dev convenience — put real auth in front of this for production
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
