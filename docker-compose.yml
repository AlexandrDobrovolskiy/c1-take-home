services:
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    restart: unless-stopped
    ports: ["3000:3000"]
    volumes:
      - ./docker/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on: [api]

  api:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: npm start
    restart: unless-stopped
    env_file: .env
    expose: ["3000"]
    deploy:
      replicas: 3
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: relay
    volumes:
      - ./docker/db/mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # named volume: data must survive `docker compose down`
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7
    restart: unless-stopped
    expose: ["6379"]
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    # remote-write receiver lets k6 push its metrics onto the same dashboard
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose: ["9090"]

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports: ["3001:3000"]
    environment:
      # dev convenience — put real auth in front of this for production
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
